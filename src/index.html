    <!--
      Ninguna boda se indexa por defecto, y la etiqueta viene ya en el HTML
      servido en vez de ponerla la aplicación al arrancar. Es deliberado: si
      dependiera del JavaScript, un rastreador que no lo ejecute —o que lea la
      página antes de que arranque— indexaría una boda que no quería salir en
      Google. El fallo seguro es no aparecer; la que sí quiera aparecer lo dice,
      y entonces `Indexacion` quita esta etiqueta. Ver REQUISITOS §8.1.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
